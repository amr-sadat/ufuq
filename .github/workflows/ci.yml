name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  affected:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: actions/cache@v4
        with:
          path: .nx/cache
          key: ${{ runner.os }}-nx-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nx-${{ hashFiles('package-lock.json') }}-

      - run: npm ci

      - uses: nrwl/nx-set-shas@v4

      - run: npx nx format:check --base=$NX_BASE --head=$NX_HEAD

      - run: npx nx affected -t lint test typecheck build --base=$NX_BASE --head=$NX_HEAD --parallel=3

      - run: npx playwright install --with-deps chromium

      - run: npx nx affected -t e2e --base=$NX_BASE --head=$NX_HEAD
